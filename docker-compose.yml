version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./backend/data:/app/data
    # Note: Skill Sandbox requires access to a Docker daemon.
    # For production, deploy using a dedicated Docker proxy (e.g. docker-socket-proxy)
    # or a rootless Docker environment to avoid host socket exposure.
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: always

volumes:
  backend_data:
